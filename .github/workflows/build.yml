name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/HackerRole.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: HackerRole
          path: src/bin/Release/net6.0/HackerRole.dll
